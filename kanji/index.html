<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6A3D9A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>漢字カード</title>
<style>
:root{--main:#6A3D9A;--bg:#F6F3FA;--ink:#222;--sub:#666;--ok:#2E7D32;--ng:#C0392B;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--main);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0}
header button{background:transparent;border:1px solid #fff8;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.big{font-size:44px;font-weight:700;color:var(--main);line-height:1.1}
.row{display:flex;gap:10px;align-items:center}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:18px;font-weight:700;margin:8px 0;color:#fff;background:var(--main)}
.btn.sec{background:#fff;color:var(--main);border:2px solid var(--main)}
.btn.ok{background:var(--ok)}.btn.ng{background:var(--ng)}
.btn:disabled{opacity:.4}
.chip{display:inline-block;color:#fff;border-radius:7px;padding:2px 9px;font-size:13px;font-weight:700}
.bar{height:10px;background:#e5e0ec;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--main)}
.subj{display:grid;grid-template-columns:86px 1fr 70px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .btn{margin:0;font-size:15px;padding:12px}
.q{font-size:30px;font-weight:700;text-align:center;margin:10px 0 4px;word-break:break-all}
.hint{text-align:center;color:var(--sub);font-size:14px;min-height:20px}
.ans{font-size:46px;font-weight:700;text-align:center;color:var(--main);margin:6px 0}
.pt{text-align:center;color:#444;font-size:15px}
canvas{width:100%;height:210px;background:#fff;border:2px dashed #c9bedb;border-radius:12px;touch-action:none;display:block}
.small{font-size:13px;color:var(--sub)}
.stars{color:var(--ng);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub)}
.hide{display:none}
.list div{padding:6px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px;margin:6px 0}
.toggle input{width:22px;height:22px}
</style>
</head>
<body>
<header><h1>漢字カード（期末）</h1><button id="hdrBtn" onclick="goHome()">ホーム</button></header>
<main>

<!-- ホーム -->
<section id="home">
  <div class="card">
    <div class="top"><span id="today"></span><span id="streak"></span></div>
    <div style="margin:8px 0 4px">今日の問題 <b id="todayDone">0</b> / <b id="todayGoal">30</b></div>
    <div class="bar"><i id="todayBar" style="width:0"></i></div>
    <button class="btn" id="startBtn" onclick="startDaily()">今日の30問をはじめる</button>
    <div class="small" id="todayNote"></div>
  </div>
  <div class="card">
    <b>しぼって練習</b>
    <div class="small">教科の枠の最初5分・テスト前日用（今日の問題の数には入りません）</div>
    <div class="toggle"><input type="checkbox" id="only3"><label for="only3">★★★だけ</label></div>
    <div class="grid2" id="subjBtns"></div>
    <button class="btn sec" onclick="startWrong()">書けなかった語だけ（<span id="wrongN">0</span>語）</button>
  </div>
  <div class="card">
    <b>教科ごとの「覚えた」</b><span class="small">（3回続けて書けたら覚えた）</span>
    <div id="subjProg"></div>
    <div class="small" id="totalProg"></div>
  </div>
  <div class="card">
    <b>問題データ</b>
    <div class="small" id="dataInfo">まだ入っていません</div>
    <input type="file" id="file" accept=".json,application/json" class="hide" onchange="importFile(this)">
    <button class="btn sec" onclick="document.getElementById('file').click()">ファイルを選ぶ</button>
    <div class="row"><span class="small">1日の問題数</span>
      <select id="goalSel" onchange="setGoal(this.value)"><option>20</option><option selected>30</option><option>40</option><option>50</option></select></div>
  </div>
</section>

<!-- 問題 -->
<section id="quiz" class="hide">
  <div class="card">
    <div class="top"><span><span class="chip" id="qChip"></span> <span id="qNo"></span> <span class="stars" id="qStar"></span></span><span id="qCount"></span></div>
    <div class="bar" style="margin-top:6px"><i id="qBar"></i></div>
    <div class="small" id="qMode" style="text-align:center;margin-top:8px"></div>
    <div class="q" id="qText"></div>
    <div class="hint" id="qGrp"></div>
  </div>
  <div class="card">
    <div class="top"><span>指で書く（紙に書いてもOK）</span><button class="btn sec" style="width:auto;margin:0;padding:6px 14px;font-size:14px" onclick="clearPad()">消す</button></div>
    <canvas id="pad"></canvas>
  </div>
  <div id="beforeAns"><button class="btn" onclick="reveal()">答えを見る</button></div>
  <div id="afterAns" class="hide">
    <div class="card"><div class="ans" id="aText"></div><div class="pt" id="aPt"></div></div>
    <div class="grid2"><button class="btn ng" onclick="grade(false)">書けなかった</button><button class="btn ok" onclick="grade(true)">書けた</button></div>
    <div class="small" style="text-align:center;margin-top:6px">書けなかった語は少しあとにもう一度出ます（書けるまでくり返し）</div>
  </div>
</section>

<!-- 終わり -->
<section id="done" class="hide">
  <div class="card" style="text-align:center">
    <div class="big" id="doneTitle">おわり</div>
    <div id="doneMsg" style="margin:8px 0"></div>
  </div>
  <div class="card"><b>今日書けなかった語</b><span class="small">（夜や次の枠で紙に書く）</span><div class="list" id="doneList"></div></div>
  <button class="btn" onclick="goHome()">ホームへ</button>
</section>
</main>

<script>
const COL={"生物":"#3B7A35","物理":"#59A14F","歴史":"#F28E2B","地理":"#D2691E","現代国語":"#B07AA1","言語文化":"#8A5A86"};
const IV=[0,1,3,7,14,30];               // 次に出すまでの日数（段階ごと）
const K="kanjicard-v1";
let S=load();                             // 保存データ
let Q=null;                               // いま解いている列

function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.cards)return s}catch(e){}
  return {cards:[],prog:{},goal:30,day:null,daily:null,wrongToday:[],streak:0,lastDone:null}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return ymd(new Date(Date.now()-3*3600e3))} // 午前3時で日付が変わる
function addDays(s,n){const[y,m,d]=s.split("-").map(Number);return ymd(new Date(y,m-1,d+n))}
function P(id){return S.prog[id]||(S.prog[id]={box:0,due:null,ok:0,ng:0,run:0,seen:false})}
function $(i){return document.getElementById(i)}
function show(id){["home","quiz","done"].forEach(s=>$(s).classList.toggle("hide",s!==id));window.scrollTo(0,0)}

function newDay(){
  const t=today();
  if(S.day!==t){
    if(S.daily&&S.lastDone!==S.day){} // 前日に終わらなかった
    S.day=t;S.daily=null;S.wrongToday=[];save();
  }
}
function buildDaily(){
  const t=today(),goal=S.goal||30;
  const due=S.cards.filter(c=>{const p=P(c.id);return p.seen&&p.due&&p.due<=t})
    .sort((a,b)=>(P(a.id).due<P(b.id).due?-1:1)||(P(b.id).ng-P(a.id).ng));
  const fresh=S.cards.filter(c=>!P(c.id).seen);
  let ids=due.slice(0,goal).map(c=>c.id);
  for(const c of fresh){if(ids.length>=goal)break;ids.push(c.id)}
  if(ids.length<goal){ // まだ余れば、覚えていない語を前倒しで
    const rest=S.cards.filter(c=>!ids.includes(c.id)&&P(c.id).box<4).sort((a,b)=>P(b.id).ng-P(a.id).ng);
    for(const c of rest){if(ids.length>=goal)break;ids.push(c.id)}
  }
  S.daily={ids,done:[],queue:ids.slice()};save();
}
function home(){
  newDay();
  const t=today(),goal=S.goal||30;
  $("today").textContent=t.replace(/-/g,"/");
  $("streak").textContent="連続 "+(S.streak||0)+" 日";
  $("goalSel").value=String(goal);
  const done=S.daily?S.daily.done.length:0, n=S.daily?S.daily.ids.length:Math.min(goal,S.cards.length);
  $("todayDone").textContent=done;$("todayGoal").textContent=n||goal;
  $("todayBar").style.width=(n?100*done/n:0)+"%";
  $("startBtn").textContent=!S.cards.length?"まず問題データを入れてください":(S.daily&&done>=n?"今日の分は終わり（もう一度やる）":(S.daily&&done?"続きから（あと"+(n-done)+"問）":"今日の"+(n||goal)+"問をはじめる"));
  $("startBtn").disabled=!S.cards.length;
  const dueN=S.cards.filter(c=>{const p=P(c.id);return p.seen&&p.due&&p.due<=t}).length;
  $("todayNote").textContent=S.cards.length?("復習の語 "+dueN+"・まだ出ていない語 "+S.cards.filter(c=>!P(c.id).seen).length):"";
  // 教科ボタン・進み具合
  const subs=[...new Set(S.cards.map(c=>c.subj))];
  $("subjBtns").innerHTML=subs.map(s=>`<button class="btn" style="background:${COL[s]||'#777'}" onclick="startSubj('${s}')">${s}</button>`).join("");
  $("subjProg").innerHTML=subs.map(s=>{const cs=S.cards.filter(c=>c.subj===s),m=cs.filter(c=>P(c.id).box>=3).length;
    return `<div class="subj"><span class="chip" style="background:${COL[s]||'#777'}">${s}</span><div class="bar"><i style="width:${100*m/cs.length}%;background:${COL[s]||'#777'}"></i></div><span class="small">${m}/${cs.length}</span></div>`}).join("");
  const all=S.cards.length,m=S.cards.filter(c=>P(c.id).box>=3).length;
  $("totalProg").textContent=all?`全体 ${m}/${all} 語を覚えた`:"";
  $("wrongN").textContent=S.cards.filter(c=>{const p=P(c.id);return p.seen&&p.run===0&&p.ng>0}).length;
  $("dataInfo").textContent=all?`${all}語（${subs.join("・")}）`:"まだ入っていません";
  show("home");
}
function goHome(){Q=null;home()}
function setGoal(v){S.goal=+v;if(S.daily&&!S.daily.done.length)S.daily=null;save();home()}

function startDaily(){
  newDay();
  if(!S.daily||S.daily.done.length>=S.daily.ids.length)buildDaily();
  Q={mode:"daily",queue:S.daily.queue.slice(),total:S.daily.ids.length,doneN:S.daily.done.length,label:"今日の問題"};
  next();
}
function startSubj(s){
  const only3=$("only3").checked;
  let cs=S.cards.filter(c=>c.subj===s&&(!only3||c.lv===3));
  cs.sort((a,b)=>(P(a.id).box-P(b.id).box)||(P(b.id).ng-P(a.id).ng));
  cs=cs.slice(0,only3?cs.length:10);
  Q={mode:"free",queue:cs.map(c=>c.id),total:cs.length,doneN:0,label:s+(only3?"（★★★）":"（覚えていない順に10語）")};
  next();
}
function startWrong(){
  const cs=S.cards.filter(c=>{const p=P(c.id);return p.seen&&p.run===0&&p.ng>0});
  if(!cs.length){alert("書けなかった語はありません");return}
  Q={mode:"free",queue:cs.map(c=>c.id),total:cs.length,doneN:0,label:"書けなかった語"};
  next();
}
function card(id){return S.cards.find(c=>c.id===id)}
function next(){
  if(!Q.queue.length){finish();return}
  const c=card(Q.queue[0]);
  if(!c){Q.queue.shift();next();return}
  Q.cur=c;show("quiz");
  $("qChip").textContent=c.subj;$("qChip").style.background=COL[c.subj]||"#777";
  $("qNo").textContent="No."+c.no;$("qStar").textContent=c.lv===3?"★★★":(c.lv===2?"★★":"★");
  $("qCount").textContent=Q.label+" "+Q.doneN+"/"+Q.total;
  $("qBar").style.width=(100*Q.doneN/Q.total)+"%";
  $("qMode").textContent=c.rev?"この漢字の読みを書く":"漢字で書く";
  $("qText").textContent=c.q;$("qGrp").textContent=c.grp;
  $("beforeAns").classList.remove("hide");$("afterAns").classList.add("hide");
  clearPad();
}
function reveal(){const c=Q.cur;$("aText").textContent=c.a;$("aPt").textContent=c.pt||"";
  $("aText").style.fontSize=c.a.length>8?"30px":"46px";
  $("beforeAns").classList.add("hide");$("afterAns").classList.remove("hide")}
function grade(ok){
  const c=Q.cur,p=P(c.id),t=today();
  const first=!Q.tried||!Q.tried[c.id];Q.tried=Q.tried||{};Q.tried[c.id]=1;
  p.seen=true;
  Q.queue.shift();
  if(ok){
    p.ok++;
    if(first){p.run++;p.box=Math.min(5,p.box+1)}       // 1回目で書けた
    p.due=addDays(t,IV[Math.max(1,p.box)]);
    Q.doneN++;
    if(Q.mode==="daily"){S.daily.done.push(c.id);S.daily.queue=Q.queue.slice()}
  }else{
    p.ng++;p.run=0;p.box=Math.max(0,Math.min(p.box,1));p.due=addDays(t,1);
    if(!S.wrongToday.includes(c.id))S.wrongToday.push(c.id);
    Q.queue.splice(Math.min(4,Q.queue.length),0,c.id);    // 4問あとにもう一度
    if(Q.mode==="daily")S.daily.queue=Q.queue.slice();
  }
  save();next();
}
function finish(){
  const t=today();
  if(Q.mode==="daily"&&S.lastDone!==t){S.streak=(S.lastDone===addDays(t,-1)?(S.streak||0):0)+1;S.lastDone=t;save()}
  $("doneTitle").textContent=Q.mode==="daily"?"今日の分おわり":"おわり";
  $("doneMsg").textContent=Q.mode==="daily"?`連続 ${S.streak} 日。全体 ${S.cards.filter(c=>P(c.id).box>=3).length}/${S.cards.length} 語を覚えた`:"";
  const w=S.wrongToday.map(card).filter(Boolean);
  $("doneList").innerHTML=w.length?w.map(c=>`<div><span>${c.q}</span><b>${c.a}</b></div>`).join(""):"<div>なし</div>";
  show("done");
}

// 手書き欄
const pad=$("pad"),ctx=pad.getContext("2d");let drawing=false;
function sizePad(){const r=pad.getBoundingClientRect(),d=window.devicePixelRatio||1;pad.width=r.width*d;pad.height=r.height*d;ctx.scale(d,d);ctx.lineWidth=5;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#222"}
function clearPad(){sizePad()}
function pos(e){const r=pad.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
pad.addEventListener("pointerdown",e=>{drawing=true;pad.setPointerCapture(e.pointerId);const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)});
pad.addEventListener("pointermove",e=>{if(!drawing)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()});
["pointerup","pointercancel","pointerleave"].forEach(k=>pad.addEventListener(k,()=>drawing=false));

// データの取り込み
function importFile(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);let cards=[];
    if(d.app==="kanjicard-data")cards=d.cards;
    else if(d.app==="ankicard-data"){ // 暗記カードアプリ用のqa形式も読める
      for(const dk of d.decks||[])for(const c of dk.cards||[]){
        const m=(c.q||"").match(/^【(.+?)】(.*)$/),subj=m?m[1]:(dk.name||"漢字");
        const rev=/の読みは/.test(c.q);let q=m?m[2]:c.q;
        q=rev?q.replace(/^「(.+)」の読みは？$/,"$1"):q.replace(/ を漢字で$/,"");
        cards.push({id:dk.id+"-"+c.no,no:+c.no,subj,grp:(c.cat||"").split("・").slice(1).join("・"),q,a:c.a,pt:(c.memo||"").replace("（★★★）",""),lv:/★★★/.test(c.memo||"")?3:2,rev})}
    }else throw new Error("形式が違います");
    if(!cards.length)throw new Error("問題が0です");
    S.cards=cards;S.daily=null;save();alert(cards.length+"語を取り込みました（これまでの記録は残ります）");home();
  }catch(e){alert("取り込めませんでした："+e.message)}inp.value=""};
  r.readAsText(f,"utf-8");
}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
home();
</script>
</body>
</html>
